syntax = "proto3";

package common.v1;
option go_package = "github.com/vokhanh12/refactor-rongstore-system/server/gen/proto/core/common/v1;commonv1"; 

message RequestMetadata {
  string request_id = 1;
  string locale = 2;
  string region = 3;
}

message ResponseMetadata {
  string request_id = 1;
  string trace_id = 2;
  int64 server_time = 3;
  bool degraded = 4;
}

message OperationMetadata {
  string op_id = 1;
}