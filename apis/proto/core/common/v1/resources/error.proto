syntax = "proto3";

package common.v1;

option go_package = "github.com/vokhanh12/refactor-rongstore-system/server/gen/proto/core/common/v1;commonv1";

message Violation {
  string field = 1;
  string message = 2;
  string code = 3;
  string hint = 4;
}


message ClientError {
  string code = 1;
  string message = 2;
  repeated Violation violations = 3;
}


message ServerError {
  string key = 1;
  string severity = 2;
  bool retryable = 3;
  string source = 4;
  string grpc_code = 5;
  string client_action = 6;
  string server_action = 7;
}


message Error {
  ClientError client = 1;
  ServerError server = 2;
}